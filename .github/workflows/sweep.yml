name: "Sweep periodic cleanup"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Run sweep-worktrees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTS_CONFIG_DIR: ${{ github.workspace }}
        run: bash bin/sweep-worktrees.sh --ci-mode --min-age-hours 24

      - name: Run audit-tests (issue-specific staleness)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTS_CONFIG_DIR: ${{ github.workspace }}
        run: bash bin/audit-tests.sh --dry-run --format text || true

      - name: Run audit-tests-common (scope:common orphan detection)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTS_CONFIG_DIR: ${{ github.workspace }}
        run: bash bin/audit-tests-common.sh --dry-run --format text || true

  # Opens one issue for temporary migration blocks older than 90 days. Deliberately
  # without a failure mask: a scan or gh failure must fail the job (rules/coding.md "Migration Code Blocks").
  stale-migration-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Open stale migration-block issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTS_CONFIG_DIR: ${{ github.workspace }}
        run: bash bin/open-stale-migration-issue.sh
