name: "Migration blocks audit"

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-migration-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration blocks (format + age warnings)
        env:
          AGENTS_CONFIG_DIR: ${{ github.workspace }}
        run: bash bin/check-migration-blocks.sh --all

      - name: Check plans-dir artifact names
        env:
          AGENTS_CONFIG_DIR: ${{ github.workspace }}
        run: node bin/check-plans-artifacts --source
